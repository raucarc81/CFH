          </div>
          <div className="form-actions">
            <button className="btn" onClick={() => setModal(null)}>Cancelar</button>
            <button className="btn btn-primary" onClick={handleSave}>✓ Guardar</button>
          </div>
        </Modal>
      )}
    </div>
  )
}

// ═══════════════════════════════════════════════════════════════
//  TAB: HIJOS
// ═══════════════════════════════════════════════════════════════
function TabHijos({ monthData, updateMonth }) {
  const [addChildModal, setAddChildModal] = useState(false)
  const [childName, setChildName] = useState('')
  const [modal, setModal] = useState(null) // { childId, catKey }
  const [editing, setEditing] = useState(null)
  const [form, setForm] = useState({ name: '', amount: '', date: '' })
  const children = monthData?.children || []

  const addChild = () => {
    if (!childName.trim()) return
    const child = { id: genId(), name: childName.trim(), clothing: [], food: [], education: [], treats: [], leisure: [] }
    updateMonth(md => ({ ...md, children: [...(md.children || []), child] }))
    setChildName(''); setAddChildModal(false)
  }
  const delChild = (id) => updateMonth(md => ({ ...md, children: md.children.filter(c => c.id !== id) }))

  const openAdd = (childId, catKey) => { setEditing(null); setForm({ name: '', amount: '', date: today.toISOString().split('T')[0] }); setModal({ childId, catKey }) }
  const openEdit = (childId, catKey, item) => { setEditing(item.id); setForm({ name: item.name, amount: String(item.amount), date: item.date || '' }); setModal({ childId, catKey }) }

  const handleSave = () => {
    if (!form.name || !form.amount) return
    const item = { id: editing || genId(), name: form.name, amount: Number(form.amount), date: form.date }
    updateMonth(md => ({
      ...md,
      children: md.children.map(c => c.id === modal.childId ? {
        ...c,
        [modal.catKey]: editing ? c[modal.catKey].map(x => x.id === editing ? item : x) : [...(c[modal.catKey] || []), item]
      } : c)
    }))
    setModal(null)
  }

  const delItem = (childId, catKey, itemId) => updateMonth(md => ({
    ...md, children: md.children.map(c => c.id === childId ? { ...c, [catKey]: c[catKey].filter(x => x.id !== itemId) } : c)
  }))

  const childTotal = (child) => CHILD_CATS.reduce((s, cat) => s + (child[cat.key] || []).reduce((ss, i) => ss + (Number(i.amount) || 0), 0), 0)

  return (
    <div className="fade-in">
      {children.length === 0 ? (
        <div className="card" style={{ marginBottom: 14 }}>
          <div className="card-body" style={{ textAlign: 'center', padding: '32px' }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>👶</div>
            <div style={{ fontSize: 15, fontWeight: 500, marginBottom: 8 }}>Sin hijos configurados</div>
            <div style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 20 }}>Añade hijos para registrar sus gastos</div>
            <button className="btn btn-primary" onClick={() => setAddChildModal(true)}>+ Añadir hijo/a</button>
          </div>
        </div>
      ) : (
        <div className="section-grid">
          {children.map(child => (
            <div key={child.id} className="card">
              <div className="card-header">
                <div className="card-header-left">
                  <span style={{ fontSize: 20 }}>👶</span>
                  <div>
                    <div className="card-title">{child.name}</div>
                    <div className="card-subtitle">Total: {fmt(childTotal(child))}</div>
                  </div>
                </div>
                <button className="btn btn-sm" style={{ color: 'var(--red)', borderColor: 'var(--red)' }} onClick={() => delChild(child.id)}>Eliminar</button>
              </div>
              <div className="card-body">
                {CHILD_CATS.map(cat => {
                  const items = child[cat.key] || []
                  const total = items.reduce((s, i) => s + (Number(i.amount) || 0), 0)
                  return (
                    <AccordionSection key={cat.key} icon={cat.icon} title={cat.label} total={total} color={CLR.child} colorBg={CLR.childBg}
                      defaultOpen={false} onAdd={() => openAdd(child.id, cat.key)} addLabel="Gasto">
                      {items.length === 0 ? <EmptyState icon={cat.icon} text={`Sin gastos de ${cat.label.toLowerCase()}`} /> :
                        <div className="line-items">
                          {items.map(i => <LineItem key={i.id} name={i.name} amount={i.amount} color={CLR.child}
                            meta={fmtDate(i.date)}
                            onEdit={() => openEdit(child.id, cat.key, i)}
                            onDelete={() => delItem(child.id, cat.key, i.id)} />)}
                        </div>}
                    </AccordionSection>
                  )
                })}
              </div>
            </div>
          ))}
          <button className="btn-add" style={{ width: '100%', padding: '12px', justifyContent: 'center' }} onClick={() => setAddChildModal(true)}>
            + Añadir otro hijo/a
          </button>
        </div>
      )}

      {addChildModal && (
        <Modal title="Añadir hijo/a" onClose={() => setAddChildModal(false)}>
          <Field label="Nombre del hijo/a" value={childName} onChange={setChildName} placeholder="Ej: Carlos, María..." />
          <div className="form-actions">
            <button className="btn" onClick={() => setAddChildModal(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={addChild}>✓ Añadir</button>
          </div>
        </Modal>
      )}

      {modal && (
        <Modal title={`Añadir gasto — ${CHILD_CATS.find(c => c.key === modal.catKey)?.label}`} onClose={() => setModal(null)}>
          <Field label="Descripción" value={form.name} onChange={v => setForm(f => ({ ...f, name: v }))} placeholder="Descripción del gasto" />
          <div className="form-row">
            <Field label="Importe (€)" value={form.amount} onChange={v => setForm(f => ({ ...f, amount: v }))} type="number" min="0" step="0.01" />
            <Field label="Fecha" value={form.date} onChange={v => setForm(f => ({ ...f, date: v }))} type="date" />
          </div>
          <div className="form-actions">
            <button className="btn" onClick={() => setModal(null)}>Cancelar</button>
            <button className="btn btn-primary" onClick={handleSave}>✓ Guardar</button>
          </div>
        </Modal>
      )}
    </div>
  )
}

// ═══════════════════════════════════════════════════════════════
//  TAB: OTROS GASTOS
// ═══════════════════════════════════════════════════════════════
function TabOtrosGastos({ monthData, updateMonth }) {
  const [modal, setModal] = useState(null)
  const [editing, setEditing] = useState(null)
  const [form, setForm] = useState({ name: '', amount: '', date: '' })
  const oe = monthData?.otherExp || {}

  const SECS = [
    { key: 'gifts', label: 'Regalos', icon: '🎁', color: '#D85A30', bg: '#FAECE7' },
    { key: 'events', label: 'Eventos', icon: '🎉', color: '#7F77DD', bg: '#EEEDFE' },
    { key: 'others', label: 'Otros', icon: '📦', color: CLR.other, bg: CLR.otherBg },
  ]

  const openAdd = (key) => { setEditing(null); setForm({ name: '', amount: '', date: today.toISOString().split('T')[0] }); setModal(key) }
  const openEdit = (key, item) => { setEditing(item.id); setForm({ name: item.name, amount: String(item.amount), date: item.date || '' }); setModal(key) }

  const handleSave = () => {
    if (!form.name || !form.amount) return
    const item = { id: editing || genId(), name: form.name, amount: Number(form.amount), date: form.date }
    updateMonth(md => ({
      ...md, otherExp: {
        ...(md.otherExp || {}),
        [modal]: editing ? (oe[modal] || []).map(x => x.id === editing ? item : x) : [...(oe[modal] || []), item]
      }
    }))
    setModal(null)
  }

  const del = (key, id) => updateMonth(md => ({ ...md, otherExp: { ...md.otherExp, [key]: (oe[key] || []).filter(x => x.id !== id) } }))
  const grandTotal = SECS.reduce((s, sec) => s + (oe[sec.key] || []).reduce((ss, i) => ss + (Number(i.amount) || 0), 0), 0)

  return (
    <div className="fade-in section-grid">
      {SECS.map(sec => {
        const items = oe[sec.key] || []
        const total = items.reduce((s, i) => s + (Number(i.amount) || 0), 0)
        return (
          <AccordionSection key={sec.key} icon={sec.icon} title={sec.label} total={total} color={sec.color} colorBg={sec.bg}
            onAdd={() => openAdd(sec.key)} addLabel={sec.label}>
            {items.length === 0 ? <EmptyState icon={sec.icon} text={`Sin ${sec.label.toLowerCase()} este mes`} /> :
              <div className="line-items">
                {items.map(i => <LineItem key={i.id} name={i.name} amount={i.amount} color={sec.color} meta={fmtDate(i.date)}
                  onEdit={() => openEdit(sec.key, i)} onDelete={() => del(sec.key, i.id)} />)}
              </div>}
          </AccordionSection>
        )
      })}
      <div className="card">
        <div className="card-body" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span style={{ fontWeight: 600, color: 'var(--text-muted)', fontSize: 13 }}>TOTAL OTROS GASTOS</span>
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: 20, fontWeight: 600, color: CLR.other }}>{fmt(grandTotal)}</span>
        </div>
      </div>

      {modal && (
        <Modal title={`Añadir ${SECS.find(s => s.key === modal)?.label || ''}`} onClose={() => setModal(null)}>
          <Field label="Descripción" value={form.name} onChange={v => setForm(f => ({ ...f, name: v }))} placeholder="Descripción del gasto" />
          <div className="form-row">
            <Field label="Importe (€)" value={form.amount} onChange={v => setForm(f => ({ ...f, amount: v }))} type="number" min="0" step="0.01" />
            <Field label="Fecha" value={form.date} onChange={v => setForm(f => ({ ...f, date: v }))} type="date" />
          </div>
          <div className="form-actions">
            <button className="btn" onClick={() => setModal(null)}>Cancelar</button>
            <button className="btn btn-primary" onClick={handleSave}>✓ Guardar</button>
          </div>
        </Modal>
      )}
    </div>
  )
}

// ═══════════════════════════════════════════════════════════════
//  TAB: AHORRO E INVERSIÓN
// ═══════════════════════════════════════════════════════════════
function TabAhorro({ monthData, updateMonth }) {
  const [modal, setModal] = useState(false)
  const [editing, setEditing] = useState(null)
  const [form, setForm] = useState({ name: '', amount: '' })
  const sv = monthData?.savings || {}

  const STD_FIELDS = [
    { key: 'vacation', label: '🏖️ Ahorro vacaciones', color: '#185FA5' },
    { key: 'home', label: '🏠 Ahorro hogar', color: '#1D9E75' },
    { key: 'emergency', label: '🛟 Fondo de emergencia', color: '#D85A30' },
    { key: 'investment', label: '📈 Inversión', color: '#7F77DD' },
  ]
  const others = sv.others || []
  const stdTotal = STD_FIELDS.reduce((s, f) => s + (Number(sv[f.key]) || 0), 0)
  const othersTotal = others.reduce((s, i) => s + (Number(i.amount) || 0), 0)
  const grandTotal = stdTotal + othersTotal
  const setField = (key, val) => updateMonth(md => ({ ...md, savings: { ...(md.savings || {}), [key]: Number(val) || 0 } }))

  const handleSave = () => {
    if (!form.name || !form.amount) return
    const item = { id: editing || genId(), name: form.name, amount: Number(form.amount) }
    updateMonth(md => ({
      ...md, savings: {
        ...(md.savings || {}),
        others: editing ? (md.savings?.others || []).map(x => x.id === editing ? item : x) : [...(md.savings?.others || []), item]
      }
    }))
    setModal(false)
  }

  return (
    <div className="fade-in">
      <div className="card" style={{ marginBottom: 14 }}>
        <div className="card-header">
          <div className="card-header-left">
            <span className="card-icon">🎯</span>
            <div className="card-title">Ahorro e inversión mensual</div>
          </div>
          <span className="card-total" style={{ color: CLR.savings }}>{fmt(stdTotal)}</span>
        </div>
        <div className="card-body">
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 10 }}>
            {STD_FIELDS.map(f => (
              <div key={f.key}>
                <label className="form-label">{f.label}</label>
                <input className="form-input" type="number" min="0" step="0.01" placeholder="0,00"
                  value={sv[f.key] || ''} onChange={e => setField(f.key, e.target.value)} />
              </div>
            ))}
          </div>
        </div>
      </div>

      <AccordionSection icon="➕" title="Otros ahorros / objetivos" total={othersTotal} color={CLR.savings} colorBg={CLR.savBg}
        onAdd={() => { setEditing(null); setForm({ name: '', amount: '' }); setModal(true) }} addLabel="Objetivo">
        {others.length === 0 ? <EmptyState icon="🎯" text="Sin otros objetivos de ahorro" /> :
          <div className="line-items">
            {others.map(o => <LineItem key={o.id} name={o.name} amount={o.amount} color={CLR.savings}
              onEdit={() => { setEditing(o.id); setForm({ name: o.name, amount: String(o.amount) }); setModal(true) }}
              onDelete={() => updateMonth(md => ({ ...md, savings: { ...md.savings, others: md.savings.others.filter(x => x.id !== o.id) } }))} />)}
          </div>}
      </AccordionSection>

      <div className="card">
        <div className="card-body" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span style={{ fontWeight: 600, color: 'var(--text-muted)', fontSize: 13 }}>TOTAL AHORRO E INVERSIÓN</span>
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: 20, fontWeight: 600, color: CLR.savings }}>{fmt(grandTotal)}</span>
        </div>
      </div>

      {modal && (
        <Modal title={`${editing ? 'Editar' : 'Añadir'} objetivo de ahorro`} onClose={() => setModal(false)}>
          <Field label="Nombre del objetivo" value={form.name} onChange={v => setForm(f => ({ ...f, name: v }))} placeholder="Ej: Ahorro coche, Viaje Japón..." />
          <Field label="Importe mensual (€)" value={form.amount} onChange={v => setForm(f => ({ ...f, amount: v }))} type="number" min="0" step="0.01" />
          <div className="form-actions">
            <button className="btn" onClick={() => setModal(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={handleSave}>✓ Guardar</button>
          </div>
        </Modal>
      )}
    </div>
  )
}

// ═══════════════════════════════════════════════════════════════
//  TAB: GRÁFICOS
// ═══════════════════════════════════════════════════════════════
function TabGraficos({ allMonthsData, year, month }) {
  const [selMonth, setSelMonth] = useState(month)

  const selMd = allMonthsData[`${year}-${selMonth}`]
  const selTotals = computeTotals(selMd, year, selMonth)

  const annualData = useMemo(() => MONTHS_S.map((name, i) => {
    const m = i + 1
    const md = allMonthsData[`${year}-${m}`]
    const t = computeTotals(md, year, m)
    return { name, ingresos: t.income, 'G. Fijos': t.fixed, 'G. Variables': t.varExp, Ocio: t.leisure, Ahorro: t.savings, total: t.total }
  }), [allMonthsData, year])

  const monthBreakdown = [
    { name: 'G. Fijos', value: selTotals.fixed, fill: CLR.fixed },
    { name: 'G. Variables', value: selTotals.varExp, fill: CLR.varExp },
    { name: 'Ocio', value: selTotals.leisure, fill: CLR.leisure },
    { name: 'Hijos', value: selTotals.children, fill: CLR.child },
    { name: 'Otros', value: selTotals.other, fill: CLR.other },
    { name: 'Ahorro', value: selTotals.savings, fill: CLR.savings },
  ].filter(x => x.value > 0)

  const barData = [
    { name: 'Ingresos', value: selTotals.income, fill: CLR.income },
    ...monthBreakdown,
    { name: 'SALDO', value: selTotals.balance, fill: selTotals.balance >= 0 ? CLR.income : CLR.fixed },
  ]

  const TT_STYLE = { background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 8, fontSize: 12 }

  return (
    <div className="fade-in">
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 20 }}>
        <span style={{ fontSize: 13, color: 'var(--text-muted)' }}>Mes detallado:</span>
        <select className="form-input" style={{ width: 160 }} value={selMonth} onChange={e => setSelMonth(Number(e.target.value))}>
          {MONTHS.map((m, i) => <option key={i} value={i + 1}>{m}</option>)}
        </select>
      </div>

      {/* Chart 1: Month bars */}
      <div className="card chart-full">
        <div className="card-body">
          <div className="chart-title">📊 Ingresos vs. Gastos — {MONTHS[selMonth - 1]} {year}</div>
          <ResponsiveContainer width="100%" height={280}>
            <BarChart data={barData} layout="vertical" margin={{ left: 80, right: 20 }}>
              <CartesianGrid strokeDasharray="3 3" horizontal={false} stroke="var(--border)" />
              <XAxis type="number" tick={{ fill: 'var(--text-muted)', fontSize: 11 }} axisLine={false} tickLine={false}
                tickFormatter={v => v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v} />
              <YAxis type="category" dataKey="name" tick={{ fill: 'var(--text)', fontSize: 12 }} axisLine={false} tickLine={false} width={80} />
              <Tooltip formatter={(v) => fmt(v)} contentStyle={TT_STYLE} />
              <Bar dataKey="value" radius={[0, 4, 4, 0]}>
                {barData.map((d, i) => <Cell key={i} fill={d.fill} />)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Chart 2: Annual */}
      <div className="card chart-full">
        <div className="card-body">
          <div className="chart-title">📈 Evolución anual — {year}</div>
          <ResponsiveContainer width="100%" height={280}>
            <BarChart data={annualData} barGap={2} barCategoryGap="25%">
              <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" vertical={false} />
              <XAxis dataKey="name" tick={{ fill: 'var(--text-muted)', fontSize: 11 }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fill: 'var(--text-muted)', fontSize: 11 }} axisLine={false} tickLine={false}
                tickFormatter={v => v >= 1000 ? (v / 1000).toFixed(0) + 'k' : v} />
              <Tooltip formatter={(v) => fmt(v)} contentStyle={TT_STYLE} />
              <Legend wrapperStyle={{ fontSize: 12 }} />
              <Bar dataKey="ingresos" name="Ingresos" fill={CLR.income} radius={[3, 3, 0, 0]} />
              <Bar dataKey="total" name="Gastos totales" fill={CLR.fixed} radius={[3, 3, 0, 0]} />
              <Bar dataKey="Ahorro" name="Ahorro" fill={CLR.savings} radius={[3, 3, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Chart 3: Pie */}
      <div className="chart-grid">
        <div className="card">
          <div className="card-body">
            <div className="chart-title">🥧 Distribución gastos — {MONTHS[selMonth - 1]}</div>
            {monthBreakdown.length > 0 ? (
              <>
                <ResponsiveContainer width="100%" height={220}>
                  <PieChart>
                    <Pie data={monthBreakdown} dataKey="value" cx="50%" cy="50%" outerRadius={85} strokeWidth={0} paddingAngle={2}
                      label={({ name, percent }) => `${name} ${Math.round(percent * 100)}%`}
                      labelLine={{ stroke: 'var(--border)', strokeWidth: 1 }}>
                      {monthBreakdown.map((d, i) => <Cell key={i} fill={d.fill} />)}
                    </Pie>
                    <Tooltip formatter={(v) => fmt(v)} contentStyle={TT_STYLE} />
                  </PieChart>
                </ResponsiveContainer>
                <div className="chart-legend" style={{ justifyContent: 'center' }}>
                  {monthBreakdown.map((d, i) => (
                    <div key={i} className="legend-item">
                      <span className="legend-dot" style={{ background: d.fill }} />
                      <span>{d.name}: {fmt(d.value)}</span>
                    </div>
                  ))}
                </div>
              </>
            ) : <EmptyState icon="📊" text="Sin datos de gastos para este mes" />}
          </div>
        </div>

        <div className="card">
          <div className="card-body">
            <div className="chart-title">📋 Resumen acumulado {year}</div>
            <table className="summary-table">
              <thead><tr><th>Mes</th><th className="amount-col">Ingresos</th><th className="amount-col">Gastos</th><th className="amount-col">Saldo</th></tr></thead>
              <tbody>
                {annualData.filter(d => d.ingresos > 0 || d.total > 0).map((d, i) => (
                  <tr key={i}>
                    <td>{d.name}</td>
                    <td className="amount-col" style={{ color: CLR.income }}>{fmt(d.ingresos)}</td>
                    <td className="amount-col" style={{ color: CLR.fixed }}>{fmt(d.total)}</td>
                    <td className="amount-col" style={{ color: d.ingresos - d.total >= 0 ? CLR.income : CLR.fixed }}>{fmt(d.ingresos - d.total)}</td>
                  </tr>
                ))}
                {(() => {
                  const totInc = annualData.reduce((s, d) => s + d.ingresos, 0)
                  const totGas = annualData.reduce((s, d) => s + d.total, 0)
                  return (
                    <tr className="total-row">
                      <td>TOTAL</td>
                      <td className="amount-col" style={{ color: CLR.income }}>{fmt(totInc)}</td>
                      <td className="amount-col" style={{ color: CLR.fixed }}>{fmt(totGas)}</td>
                      <td className="amount-col" style={{ color: totInc - totGas >= 0 ? CLR.income : CLR.fixed }}>{fmt(totInc - totGas)}</td>
                    </tr>
                  )
                })()}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  )
}

// ═══════════════════════════════════════════════════════════════
//  TAB: AJUSTES
// ═══════════════════════════════════════════════════════════════
function TabAjustes({ store, setStore }) {
  const { settings, users } = store
  const [addUserModal, setAddUserModal] = useState(false)
  const [newUserName, setNewUserName] = useState('')
  const [newUserColor, setNewUserColor] = useState(THEME_COLORS[0])

  const updSetting = (key, val) => setStore(s => ({ ...s, settings: { ...s.settings, [key]: val } }))

  const exportData = () => {
    const json = JSON.stringify(store, null, 2)
    const blob = new Blob([json], { type: 'application/json' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = `CFH_backup_${new Date().toISOString().slice(0, 10)}.json`
    a.click()
    URL.revokeObjectURL(url)
  }

  const importData = (e) => {
    const file = e.target.files[0]
    if (!file) return
    const reader = new FileReader()
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result)
        if (data.users && data.data) { setStore(data); alert('✅ Datos importados correctamente') }
        else alert('❌ Archivo no válido')
      } catch { alert('❌ Error al leer el archivo') }
    }
    reader.readAsText(file)
  }

  const addUser = () => {
    if (!newUserName.trim()) return
    const newUser = { id: genId(), name: newUserName.trim(), color: newUserColor }
    setStore(s => ({ ...s, users: [...s.users, newUser] }))
    setNewUserName(''); setAddUserModal(false)
  }

  const delUser = (id) => {
    if (users.length <= 1) return alert('Debe haber al menos un usuario.')
    setStore(s => ({ ...s, users: s.users.filter(u => u.id !== id), currentUser: s.currentUser === id ? s.users[0].id : s.currentUser, data: Object.fromEntries(Object.entries(s.data).filter(([k]) => k !== id)) }))
  }

  const handlePhotoUpload = (e) => {
    const file = e.target.files[0]
    if (!file) return
    const reader = new FileReader()
    reader.onload = (ev) => updSetting('familyPhoto', ev.target.result)
    reader.readAsDataURL(file)
  }

  return (
    <div className="fade-in">
      <div className="settings-grid">
        <div className="card">
          <div className="card-header"><div className="card-header-left"><span className="card-icon">👨‍👩‍👧‍👦</span><div className="card-title">Familia</div></div></div>
          <div className="card-body">
            <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 16 }}>
              <div style={{ width: 56, height: 56, borderRadius: '50%', background: settings.primaryColor, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', cursor: 'pointer', border: '2px dashed var(--border)' }}
                onClick={() => document.getElementById('photo-upload').click()}>
                {settings.familyPhoto ? <img src={settings.familyPhoto} alt="Familia" style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> :
                  <span style={{ fontSize: 22 }}>🏠</span>}
              </div>
              <div style={{ flex: 1 }}>
                <Field label="Nombre de la familia">
                  <input className="form-input" value={settings.familyName} onChange={e => updSetting('familyName', e.target.value)} placeholder="Familia..." />
                </Field>
              </div>
              <input id="photo-upload" type="file" accept="image/*" style={{ display: 'none' }} onChange={handlePhotoUpload} />
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-header"><div className="card-header-left"><span className="card-icon">🎨</span><div className="card-title">Apariencia</div></div></div>
          <div className="card-body">
            <div className="form-field">
              <div className="form-label">Tema</div>
              <div style={{ display: 'flex', gap: 8 }}>
                {['light', 'dark'].map(t => (
                  <button key={t} className={`btn ${settings.theme === t ? 'btn-primary' : ''}`} onClick={() => updSetting('theme', t)}>
                    {t === 'light' ? '☀️ Claro' : '🌙 Oscuro'}
                  </button>
                ))}
              </div>
            </div>
            <div className="form-field">
              <div className="form-label">Color principal</div>
              <div className="color-swatches">
                {THEME_COLORS.map(c => (
                  <div key={c} className={`color-swatch ${settings.primaryColor === c ? 'selected' : ''}`}
                    style={{ background: c }} onClick={() => updSetting('primaryColor', c)} />
                ))}
              </div>
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-header"><div className="card-header-left"><span className="card-icon">👥</span><div className="card-title">Usuarios</div></div>
            <button className="btn btn-sm" onClick={() => setAddUserModal(true)}>+ Añadir</button>
          </div>
          <div className="card-body">
            {users.map(u => (
              <div key={u.id} className="line-item">
                <div className="line-item-left">
                  <div style={{ width: 28, height: 28, borderRadius: '50%', background: u.color, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontSize: 11, fontWeight: 600 }}>
                    {u.name.slice(0, 2).toUpperCase()}
                  </div>
                  <span className="line-item-name">{u.name}</span>
                  {u.id === store.currentUser && <span className="badge" style={{ background: CLR.incomeBg, color: CLR.income, fontSize: 10 }}>Activo</span>}
                </div>
                <div className="line-item-right">
                  <button className="icon-btn danger" onClick={() => delUser(u.id)}>🗑️</button>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="card">
          <div className="card-header"><div className="card-header-left"><span className="card-icon">💾</span><div className="card-title">Copia de seguridad</div></div></div>
          <div className="card-body">
            <p style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 16 }}>Exporta todos tus datos en un archivo JSON. Importa un backup previo para restaurar.</p>
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              <button className="btn btn-primary" onClick={exportData}>⬇️ Exportar backup</button>
              <label className="btn" style={{ cursor: 'pointer' }}>
                ⬆️ Importar backup
                <input type="file" accept=".json" style={{ display: 'none' }} onChange={importData} />
              </label>
            </div>
          </div>
        </div>
      </div>

      {addUserModal && (
        <Modal title="Añadir usuario" onClose={() => setAddUserModal(false)}>
          <Field label="Nombre del usuario" value={newUserName} onChange={setNewUserName} placeholder="Ej: María, Papá..." />
          <div className="form-field">
            <div className="form-label">Color</div>
            <div className="color-swatches">
              {THEME_COLORS.map(c => <div key={c} className={`color-swatch ${newUserColor === c ? 'selected' : ''}`} style={{ background: c }} onClick={() => setNewUserColor(c)} />)}
            </div>
          </div>
          <div className="form-actions">
            <button className="btn" onClick={() => setAddUserModal(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={addUser}>✓ Añadir</button>
          </div>
        </Modal>
      )}
    </div>
  )
}

// ═══════════════════════════════════════════════════════════════
//  MAIN APP
// ═══════════════════════════════════════════════════════════════
function App() {
  const [store, setStore] = useState(() => loadStore() || DEFAULT_STORE)
  const [tab, setTab] = useState('resumen')
  const [showSetup, setShowSetup] = useState(false)
  const fileInputRef = useRef(null)
  const [deferredPrompt, setDeferredPrompt] = useState(null)

  useEffect(() => {
    if (window.deferredInstallPrompt) setDeferredPrompt(window.deferredInstallPrompt)
    const handler = (e) => { e.preventDefault(); setDeferredPrompt(e); window.deferredInstallPrompt = e }
    const pwaReady = () => { if (window.deferredInstallPrompt) setDeferredPrompt(window.deferredInstallPrompt) }
    window.addEventListener('beforeinstallprompt', handler)
    window.addEventListener('pwa-listo', pwaReady)
    window.addEventListener('appinstalled', () => { setDeferredPrompt(null); window.deferredInstallPrompt = null })
    return () => { window.removeEventListener('beforeinstallprompt', handler); window.removeEventListener('pwa-listo', pwaReady) }
  }, [])

  const installApp = () => {
    if (!deferredPrompt) return
    deferredPrompt.prompt()
    deferredPrompt.userChoice.then(() => { setDeferredPrompt(null); window.deferredInstallPrompt = null })
  }

  const { settings, users, currentUser, selectedYear, selectedMonth, data } = store
  const userData = data[currentUser] || {}
  const monthKey = `${selectedYear}-${selectedMonth}`
  const monthData = userData[monthKey]
  const totals = useMemo(() => computeTotals(monthData, selectedYear, selectedMonth), [monthData, selectedYear, selectedMonth])

  // Apply theme
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', settings.theme)
    document.documentElement.style.setProperty('--teal', settings.primaryColor)
    document.documentElement.style.setProperty('--teal-dark', settings.primaryColor)
    document.documentElement.style.setProperty('--bg-sidebar-active', settings.primaryColor)
  }, [settings.theme, settings.primaryColor])

  // Save to localStorage
  useEffect(() => { localStorage.setItem(STORE_KEY, JSON.stringify(store)) }, [store])

  // Initialize month
  useEffect(() => {
    if (!monthData) {
      const prev = Object.keys(userData).sort().filter(k => k < monthKey).pop()
      const prevMd = prev ? userData[prev] : null
      const newMd = buildEmptyMonth(prevMd)
      setStore(s => ({
        ...s,
        data: { ...s.data, [s.currentUser]: { ...userData, [monthKey]: newMd } }
      }))
      setShowSetup(true)
    } else if (!monthData.initialized && !showSetup) {
      setShowSetup(true)
    }
  }, [monthKey, currentUser])

  const updateMonth = useCallback((updater) => {
    setStore(s => {
      const ud = s.data[s.currentUser] || {}
      const key = `${s.selectedYear}-${s.selectedMonth}`
      return { ...s, data: { ...s.data, [s.currentUser]: { ...ud, [key]: updater(ud[key] || {}) } } }
    })
  }, [])

  const handleSetupSave = (fixedData) => {
    updateMonth(md => ({ ...md, ...fixedData, initialized: true }))
    setShowSetup(false)
  }

  const prevMonth = () => {
    setStore(s => {
      let m = s.selectedMonth - 1, y = s.selectedYear
      if (m < 1) { m = 12; y-- }
      return { ...s, selectedYear: y, selectedMonth: m }
    })
  }

  const nextMonth = () => {
    setStore(s => {
      let m = s.selectedMonth + 1, y = s.selectedYear
      if (m > 12) { m = 1; y++ }
      return { ...s, selectedYear: y, selectedMonth: m }
    })
  }

  const NAV = [
    { id: 'resumen', label: 'Resumen', icon: '🏠', group: 'Principal' },
    { id: 'ingresos', label: 'Ingresos', icon: '💰', group: 'Finanzas' },
    { id: 'fijos', label: 'G. Fijos', icon: '🔒', group: 'Finanzas' },
    { id: 'variables', label: 'G. Variables', icon: '📊', group: 'Finanzas' },
    { id: 'ocio', label: 'Ocio', icon: '🎭', group: 'Finanzas' },
    { id: 'hijos', label: 'Hijos', icon: '👶', group: 'Finanzas' },
    { id: 'otros', label: 'Otros Gastos', icon: '📦', group: 'Finanzas' },
    { id: 'ahorro', label: 'Ahorro', icon: '🎯', group: 'Finanzas' },
    { id: 'graficos', label: 'Gráficos', icon: '📈', group: 'Análisis' },
    { id: 'ajustes', label: 'Ajustes', icon: '⚙️', group: 'Configuración' },
  ]

  const groups = [...new Set(NAV.map(n => n.group))]

  const PAGE_TITLES = {
    resumen: { title: 'Resumen', sub: 'Vista general del mes' },
    ingresos: { title: 'Ingresos', sub: 'Nóminas y extras' },
    fijos: { title: 'Gastos Fijos', sub: 'Hipoteca, préstamos, seguros' },
    variables: { title: 'Gastos Variables', sub: 'Luz, agua, supermercado...' },
    ocio: { title: 'Ocio', sub: 'Entretenimiento y restauración' },
    hijos: { title: 'Hijos', sub: 'Gastos por hijo/a' },
    otros: { title: 'Otros Gastos', sub: 'Regalos y eventos' },
    ahorro: { title: 'Ahorro e Inversión', sub: 'Fondos y objetivos' },
    graficos: { title: 'Gráficos', sub: 'Visualización de datos' },
    ajustes: { title: 'Ajustes', sub: 'Configuración de la app' },
  }

  const currentUser_obj = users.find(u => u.id === currentUser) || users[0]

  return (
    <div className="app-layout">
      {/* SIDEBAR */}
      <aside className="sidebar">
        <div className="sidebar-brand">
          <div className="sidebar-brand-logo">CFH</div>
          <div className="sidebar-brand-name">Control Financiero<br />Hogar</div>
          {settings.familyName && <div className="sidebar-brand-family">{settings.familyName}</div>}
        </div>

        <div className="sidebar-month-selector">
          <div className="sidebar-month-label">Período activo</div>
          <div className="year-nav">
            <button className="month-nav-btn" onClick={() => setStore(s => ({ ...s, selectedYear: s.selectedYear - 1 }))}>‹</button>
            <span style={{ fontSize: 12, color: '#e2e8f0', fontWeight: 500 }}>{selectedYear}</span>
            <button className="month-nav-btn" onClick={() => setStore(s => ({ ...s, selectedYear: s.selectedYear + 1 }))}>›</button>
          </div>
          <div className="month-nav" style={{ marginTop: 4 }}>
            <button className="month-nav-btn" onClick={prevMonth}>‹</button>
            <span className="month-nav-current">{MONTHS[selectedMonth - 1]}</span>
            <button className="month-nav-btn" onClick={nextMonth}>›</button>
          </div>
        </div>

        <div className="sidebar-balance">
          <div className="balance-label">Saldo del mes</div>
          <div className={`balance-value ${totals.balance >= 0 ? 'balance-positive' : 'balance-negative'}`}>
            {fmt(totals.balance)}
          </div>
        </div>

        <nav className="sidebar-nav">
          {groups.map(group => (
            <div key={group}>
              <div className="nav-group-label">{group}</div>
              {NAV.filter(n => n.group === group).map(n => (
                <button key={n.id} className={`nav-item ${tab === n.id ? 'active' : ''}`} onClick={() => setTab(n.id)}>
                  <span className="nav-item-icon">{n.icon}</span>
                  <span>{n.label}</span>
                </button>
              ))}
            </div>
          ))}
        </nav>

        {/* User switcher */}
        {users.length > 1 && (
          <div style={{ padding: '12px 16px', borderTop: '1px solid rgba(255,255,255,0.07)' }}>
            <div className="sidebar-month-label">Usuario</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginTop: 6 }}>
              {users.map(u => (
                <button key={u.id} className={`nav-item ${currentUser === u.id ? 'active' : ''}`}
                  onClick={() => setStore(s => ({ ...s, currentUser: u.id }))}>
                  <div style={{ width: 18, height: 18, borderRadius: '50%', background: u.color, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontSize: 9, fontWeight: 700 }}>
                    {u.name.slice(0, 2).toUpperCase()}
                  </div>
                  <span>{u.name}</span>
                </button>
              ))}
            </div>
          </div>
        )}
      </aside>

      {/* MAIN */}
      <div className="main-content">
        <header className="main-header">
          <div>
            <div className="header-title">{PAGE_TITLES[tab]?.title}</div>
            <div className="header-subtitle">{MONTHS[selectedMonth - 1]} {selectedYear} · {PAGE_TITLES[tab]?.sub}</div>
          </div>
          <div className="header-actions">
            {deferredPrompt && (
              <button className="header-btn primary" onClick={installApp}>📲 Instalar CFH</button>
            )}
            {!monthData?.initialized && (
              <button className="header-btn" onClick={() => setShowSetup(true)}>⚙️ Configurar mes</button>
            )}
            <button className="header-btn" onClick={() => {
              const json = JSON.stringify(store, null, 2)
              const blob = new Blob([json], { type: 'application/json' })
              const url = URL.createObjectURL(blob)
              const a = document.createElement('a'); a.href = url
              a.download = `CFH_backup_${new Date().toISOString().slice(0, 10)}.json`; a.click()
              URL.revokeObjectURL(url)
            }}>💾 Backup</button>
          </div>
        </header>

        <main className="page">
          {tab === 'resumen' && (
            <TabResumen monthData={monthData} totals={totals} year={selectedYear} month={selectedMonth} allMonthsData={userData} />
          )}
          {tab === 'ingresos' && <TabIngresos monthData={monthData} updateMonth={updateMonth} />}
          {tab === 'fijos' && <TabGastosFijos monthData={monthData} updateMonth={updateMonth} year={selectedYear} month={selectedMonth} />}
          {tab === 'variables' && <TabGastosVariables monthData={monthData} updateMonth={updateMonth} />}
          {tab === 'ocio' && <TabOcio monthData={monthData} updateMonth={updateMonth} />}
          {tab === 'hijos' && <TabHijos monthData={monthData} updateMonth={updateMonth} />}
          {tab === 'otros' && <TabOtrosGastos monthData={monthData} updateMonth={updateMonth} />}
          {tab === 'ahorro' && <TabAhorro monthData={monthData} updateMonth={updateMonth} />}
          {tab === 'graficos' && <TabGraficos allMonthsData={userData} year={selectedYear} month={selectedMonth} />}
          {tab === 'ajustes' && <TabAjustes store={store} setStore={setStore} />}
        </main>

        <nav className="mobile-nav">
          {NAV.map(n => (
            <button key={n.id}
              className={`mobile-nav-item ${tab === n.id ? 'active' : ''}`}
              onClick={() => setTab(n.id)}>
              <span className="mobile-nav-icon">{n.icon}</span>
              <span className="mobile-nav-label">{n.label}</span>
            </button>
          ))}
        </nav>

      </div>

      {/* SETUP MODAL */}
      {showSetup && (
        <SetupModal
          month={selectedMonth}
          year={selectedYear}
          monthData={monthData}
          onSave={handleSetupSave}
          onSkip={() => { updateMonth(md => ({ ...md, initialized: true })); setShowSetup(false) }}
        />
      )}
    </div>
  )
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
