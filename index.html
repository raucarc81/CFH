<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a6b4a" />
  <meta name="description" content="CFH – Control Financiero Hogar" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CFH" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <title>CFH – Control Financiero Hogar</title>
  <style>
/* ═══════════════════════════════════════════════
   CFH – Control Financiero Hogar
   Global Styles
═══════════════════════════════════════════════ */

:root {
  --font-ui: 'Outfit', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* Light theme */
  --bg: #f5f6f8;
  --bg-card: #ffffff;
  --bg-sidebar: #1a2340;
  --bg-sidebar-hover: #253358;
  --bg-sidebar-active: #0f6e56;
  --text: #0f172a;
  --text-muted: #64748b;
  --text-sidebar: #94a3b8;
  --text-sidebar-active: #ffffff;
  --border: #e2e8f0;
  --border-focus: #1D9E75;
  --input-bg: #f8fafc;
  --overlay: rgba(15, 23, 42, 0.5);

  /* Brand colors */
  --teal: #1D9E75;
  --teal-light: #E1F5EE;
  --teal-dark: #0F6E56;
  --coral: #D85A30;
  --coral-light: #FAECE7;
  --amber: #BA7517;
  --amber-light: #FAEEDA;
  --blue: #185FA5;
  --blue-light: #E6F1FB;
  --purple: #534AB7;
  --purple-light: #EEEDFE;
  --red: #A32D2D;
  --red-light: #FCEBEB;
  --green: #3B6D11;
  --green-light: #EAF3DE;

  /* Shadows */
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.06);
  --radius: 10px;
  --radius-lg: 14px;
  --sidebar-width: 220px;
}

[data-theme="dark"] {
  --bg: #0d1117;
  --bg-card: #161b22;
  --bg-sidebar: #0d1117;
  --bg-sidebar-hover: #1c2433;
  --bg-sidebar-active: #0f6e56;
  --text: #e6edf3;
  --text-muted: #768390;
  --text-sidebar: #768390;
  --text-sidebar-active: #ffffff;
  --border: #30363d;
  --input-bg: #0d1117;
  --overlay: rgba(0, 0, 0, 0.7);

  --teal-light: #04342C;
  --coral-light: #4A1B0C;
  --amber-light: #412402;
  --blue-light: #042C53;
  --purple-light: #26215C;
  --red-light: #501313;
  --green-light: #173404;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

#root { display: flex; min-height: 100vh; }

/* ── LAYOUT ───────────────────────────────────── */
.app-layout {
  display: flex;
  width: 100%;
  min-height: 100vh;
}

.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-sidebar);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 100;
}

.main-content {
  margin-left: var(--sidebar-width);
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* ── SIDEBAR ─────────────────────────────────── */
.sidebar-brand {
  padding: 20px 16px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}

.sidebar-brand-logo {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--teal);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: white;
  margin-bottom: 8px;
  font-family: var(--font-mono);
}

.sidebar-brand-name {
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  line-height: 1.3;
}

.sidebar-brand-family {
  font-size: 11px;
  color: var(--text-sidebar);
  margin-top: 2px;
}

.sidebar-nav { padding: 12px 8px; flex: 1; }

.nav-group-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-sidebar);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 8px 8px 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 7px;
  cursor: pointer;
  color: var(--text-sidebar);
  font-size: 13px;
  font-weight: 400;
  transition: background 0.15s, color 0.15s;
  margin-bottom: 1px;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}

.nav-item:hover { background: var(--bg-sidebar-hover); color: #e2e8f0; }
.nav-item.active { background: var(--bg-sidebar-active); color: var(--text-sidebar-active); font-weight: 500; }

.nav-item-icon { font-size: 15px; width: 18px; text-align: center; }

.sidebar-month-selector {
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,0.07);
}

.sidebar-month-label {
  font-size: 10px;
  color: var(--text-sidebar);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}

.month-nav-btn {
  background: none;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 5px;
  color: #94a3b8;
  cursor: pointer;
  padding: 3px 7px;
  font-size: 12px;
  transition: background 0.15s;
}

.month-nav-btn:hover { background: rgba(255,255,255,0.08); }

.month-nav-current {
  font-size: 12px;
  font-weight: 500;
  color: #e2e8f0;
  text-align: center;
  flex: 1;
}

.year-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 4px;
}

.year-nav span { font-size: 11px; color: var(--text-sidebar); }

.sidebar-balance {
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,0.07);
  margin-bottom: 8px;
}

.balance-label { font-size: 10px; color: var(--text-sidebar); text-transform: uppercase; letter-spacing: 0.06em; }
.balance-value { font-size: 18px; font-weight: 600; font-family: var(--font-mono); }
.balance-positive { color: #5DCAA5; }
.balance-negative { color: #F09595; }

/* ── HEADER ──────────────────────────────────── */
.main-header {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.header-title { font-size: 16px; font-weight: 600; }
.header-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

.header-actions { display: flex; align-items: center; gap: 8px; }

.header-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font-ui);
  transition: all 0.15s;
}

.header-btn:hover { background: var(--bg); color: var(--text); border-color: var(--border-focus); }
.header-btn.primary { background: var(--teal); color: white; border-color: var(--teal); font-weight: 500; }
.header-btn.primary:hover { background: var(--teal-dark); }

/* ── PAGE CONTENT ─────────────────────────────── */
.page { padding: 24px; max-width: 1100px; }

/* ── CARDS ────────────────────────────────────── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}

.card-header-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.card-icon { font-size: 18px; }
.card-title { font-size: 14px; font-weight: 600; }
.card-subtitle { font-size: 12px; color: var(--text-muted); }
.card-total { font-family: var(--font-mono); font-size: 15px; font-weight: 500; }
.card-body { padding: 14px 18px; }

/* ── KPI CARDS ───────────────────────────────── */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  border-left: 3px solid;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.15s;
}

.kpi-card:hover { box-shadow: var(--shadow-md); }
.kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; margin-bottom: 8px; }
.kpi-value { font-size: 22px; font-weight: 600; font-family: var(--font-mono); line-height: 1.2; }
.kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.kpi-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 20px; margin-top: 6px; }

/* ── SECTION CARDS ───────────────────────────── */
.section-grid { display: flex; flex-direction: column; gap: 14px; }

/* ── LINE ITEMS ──────────────────────────────── */
.line-items { display: flex; flex-direction: column; gap: 2px; }

.line-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-radius: 7px;
  transition: background 0.1s;
  gap: 8px;
}

.line-item:hover { background: var(--bg); }

.line-item-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.line-item-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.line-item-name { font-size: 13px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line-item-badge {
  font-size: 10px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 20px;
  white-space: nowrap;
}
.line-item-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.line-item-amount { font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
.line-item-meta { font-size: 11px; color: var(--text-muted); }

.icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 3px 5px;
  border-radius: 5px;
  color: var(--text-muted);
  font-size: 12px;
  transition: background 0.1s, color 0.1s;
  display: flex;
  align-items: center;
}

.icon-btn:hover { background: var(--bg); color: var(--text); }
.icon-btn.danger:hover { color: var(--red); }

/* ── INPUTS ──────────────────────────────────── */
.form-field { margin-bottom: 14px; }
.form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
.form-input {
  width: 100%;
  padding: 9px 12px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-size: 14px;
  font-family: var(--font-ui);
  outline: none;
  transition: border-color 0.15s;
}
.form-input:focus { border-color: var(--border-focus); }
.form-input[type="number"] { font-family: var(--font-mono); }
.form-input::placeholder { color: var(--text-muted); opacity: 0.6; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ── BUTTONS ──────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 7px;
  cursor: pointer;
  font-size: 13px;
  font-family: var(--font-ui);
  font-weight: 400;
  background: transparent;
  color: var(--text);
  transition: all 0.15s;
}

.btn:hover { background: var(--bg); }

.btn-primary { background: var(--teal); color: white; border-color: var(--teal); font-weight: 500; }
.btn-primary:hover { background: var(--teal-dark); border-color: var(--teal-dark); }

.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }

.btn-add {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border: 1px dashed var(--border);
  border-radius: 7px;
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font-ui);
  background: transparent;
  color: var(--text-muted);
  transition: all 0.15s;
  margin-top: 6px;
}

.btn-add:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-light); }

/* ── MODAL ────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
}

.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}

.modal-wide { max-width: 680px; }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.modal-title { font-size: 15px; font-weight: 600; }
.modal-body { padding: 20px; }

.modal-close {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 16px;
  padding: 4px;
  border-radius: 4px;
  transition: color 0.1s;
}

.modal-close:hover { color: var(--text); }

/* ── SETUP MODAL (First month) ───────────────── */
.setup-modal { max-width: 640px; }
.setup-section { margin-bottom: 20px; }
.setup-section-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── TABS (inline) ───────────────────────────── */
.tab-row { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
.tab-item {
  padding: 8px 14px;
  font-size: 13px;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  font-family: var(--font-ui);
  transition: color 0.15s;
}
.tab-item:hover { color: var(--text); }
.tab-item.active { color: var(--teal); border-bottom-color: var(--teal); font-weight: 500; }

/* ── CHARTS ──────────────────────────────────── */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.chart-full { margin-bottom: 16px; }
.chart-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── SUMMARY TABLE ───────────────────────────── */
.summary-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.summary-table th { text-align: left; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.summary-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.summary-table tr:last-child td { border-bottom: none; }
.summary-table .amount-col { font-family: var(--font-mono); text-align: right; }
.summary-table .total-row td { font-weight: 600; background: var(--bg); }

/* ── SETUP WIZARD ────────────────────────────── */
.wizard-steps { display: flex; gap: 4px; margin-bottom: 20px; }
.wizard-step {
  flex: 1;
  height: 3px;
  border-radius: 3px;
  background: var(--border);
  transition: background 0.2s;
}
.wizard-step.active { background: var(--teal); }
.wizard-step.done { background: var(--teal); opacity: 0.4; }

/* ── SETTINGS ────────────────────────────────── */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.color-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.color-swatch {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.1s;
}
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.selected { border-color: var(--text); }

/* ── USER PILL ────────────────────────────────── */
.user-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  transition: all 0.15s;
}
.user-pill:hover, .user-pill.active { border-color: var(--teal); color: var(--teal); background: var(--teal-light); }
.user-avatar {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: white;
}

/* ── EMPTY STATE ──────────────────────────────── */
.empty-state { text-align: center; padding: 28px; color: var(--text-muted); font-size: 13px; }
.empty-state-icon { font-size: 28px; margin-bottom: 8px; }

/* ── PROGRESS BAR ─────────────────────────────── */
.progress-bar { height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

/* ── DIVIDER ──────────────────────────────────── */
.divider { height: 1px; background: var(--border); margin: 12px 0; }

/* ── BADGE ────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
}

/* ── TOTALS BAR ──────────────────────────────── */
.totals-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
}
.totals-bar-item { padding: 12px 16px; background: var(--bg-card); text-align: center; }
.totals-bar-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.totals-bar-value { font-size: 16px; font-weight: 600; font-family: var(--font-mono); }

/* ── ACCORDION SECTION ───────────────────────── */
.accordion-section { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 10px; background: var(--bg-card); }
.accordion-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
  user-select: none;
  transition: background 0.1s;
  gap: 12px;
}
.accordion-header:hover { background: var(--bg); }
.accordion-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.accordion-icon { font-size: 17px; flex-shrink: 0; }
.accordion-name { font-size: 14px; font-weight: 500; }
.accordion-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.accordion-total { font-family: var(--font-mono); font-size: 14px; font-weight: 500; }
.accordion-chevron { font-size: 10px; color: var(--text-muted); transition: transform 0.2s; }
.accordion-chevron.open { transform: rotate(180deg); }
.accordion-body { border-top: 1px solid var(--border); padding: 12px 16px; }

/* ── RESPONSIVE ──────────────────────────────── */
@media (max-width: 768px) {
  :root { --sidebar-width: 0px; }
  .sidebar { display: none; }
